# Static site server for dist/ (D4). Replaces conf.d/default.conf of nginx-unprivileged.

# Hashed build assets are immutable; everything else (HTML included) revalidates.
map $uri $cache_control {
    default       "no-cache";
    ~^/_astro/    "public, max-age=31536000, immutable";
}

# Only per-topic zips are forced to download; /files/** and /exports/** stay inline
# (the UI uses <a download>).
map $uri $content_disposition {
    default                  "";
    ~^/downloads/[^/]+\.zip$ "attachment";
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    absolute_redirect off;

    include /etc/nginx/mime.types;
    types {
        text/markdown                 md;
        text/plain                    mmd;
        application/vnd.excalidraw+json excalidraw;
        font/woff2                    woff2;
    }

    charset utf-8;
    charset_types text/markdown text/plain text/html text/css text/xml application/javascript;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css text/markdown text/xml application/json application/javascript
               application/vnd.excalidraw+json image/svg+xml;

    # `add_header` is only inherited when a location sets none, so none are set below.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Cache-Control $cache_control always;
    add_header Content-Disposition $content_disposition always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # Content-Security-Policy is generated at image build time (inline-script hashes depend on the built HTML)
    # by `node scripts/vercel-output.ts --nginx-csp dist /etc/nginx/csp.conf`; fail closed if it is missing.
    # The same buildCsp() feeds the Vercel output, so both hosts send an identical value.
    include /etc/nginx/csp.conf;

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    # /topics/x -> 301 /topics/x/ -> /topics/x/index.html
    location / {
        try_files $uri $uri/ =404;
    }
}
