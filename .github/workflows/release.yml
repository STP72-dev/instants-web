name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to (re)run, e.g. v1.2.3'
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/w7-mgfcode/instants-web

jobs:
  release:
    name: image + vercel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Resolve release tag
        id: tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Not a release tag (expected vMAJOR.MINOR.PATCH[-prerelease]): $TAG" >&2
            exit 1
          fi
          echo "name=$TAG" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-* ]]; then echo "latest=false" >> "$GITHUB_OUTPUT"; else echo "latest=true" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.tag.outputs.name }}
          fetch-depth: 0
          persist-credentials: false

      # Only commits that reached main (through CI-gated PRs) may be released.
      - name: Tag must be on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main || { echo "::error::$(git rev-parse --short HEAD) is not on main; refusing to release."; exit 1; }

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # Secret scan runs before any dependency is installed.
      - name: Secret scan (full history)
        run: node scripts/scan-diff.ts --all

      - name: Verify (lint, typecheck, tests incl. committed-snapshot audit)
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test

      - name: Short commit sha
        id: rev
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ steps.tag.outputs.name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.tag.outputs.name }}
            type=raw,value=sha-${{ steps.rev.outputs.short }}
            type=raw,value=latest,enable=${{ steps.tag.outputs.latest == 'true' }}

      # Release tags are immutable: a re-run reuses the image already published for this version.
      # GitHub Packages API: HTTP 404 = package not published yet (build); any other error fails closed.
      - name: Existing image for this version
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          version="${TAG#v}"
          pkg="users/${GITHUB_REPOSITORY_OWNER}/packages/container/${GITHUB_REPOSITORY#*/}/versions"
          if out="$(gh api --paginate "$pkg" --jq ".[] | select(.metadata.container.tags | index(\"$version\")) | .name" 2>&1)"; then
            digest="$(printf '%s' "$out" | head -n1)"
            if [ -n "$digest" ]; then
              echo "digest=$digest" >> "$GITHUB_OUTPUT"
              echo "::notice::$IMAGE:$version already published as $digest; reusing it (no rebuild, no re-tag)."
            else
              echo "$IMAGE:$version not published yet; building."
            fi
          elif printf '%s' "$out" | grep -q 'HTTP 404'; then
            echo "Package not published yet; building."
          else
            echo "::error::Could not determine whether $IMAGE:$version exists; refusing to (re)publish. API said: $out"
            exit 1
          fi

      # The only site build: `npm run build` runs inside this image build (Dockerfile build stage).
      - name: Build and push image
        id: build
        if: steps.existing.outputs.digest == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Take the static files from the exact image that was just published (by digest).
      - name: Extract static site from the published image
        env:
          DIGEST: ${{ steps.existing.outputs.digest || steps.build.outputs.digest }}
        run: |
          cid="$(docker create "$IMAGE@$DIGEST")"
          trap 'docker rm "$cid" >/dev/null' EXIT
          docker cp "$cid:/usr/share/nginx/html" "$RUNNER_TEMP/site"
          node scripts/vercel-output.ts "$RUNNER_TEMP/site" .vercel/output
          {
            echo "### Release ${{ steps.tag.outputs.name }}"
            echo "Image: \`$IMAGE@$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Gate the Vercel deploy on the published image passing the browser CSP check.
      - name: CSP check against the published image
        env:
          DIGEST: ${{ steps.existing.outputs.digest || steps.build.outputs.digest }}
        run: |
          docker run -d --name web -p 18080:8080 "$IMAGE@$DIGEST"
          for _ in $(seq 1 30); do curl -fsS -o /dev/null http://localhost:18080/ && break; sleep 1; done
          npx playwright install --with-deps chromium
          npm run csp-check -- http://localhost:18080

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            msg="Vercel deploy skipped: VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID must all be set (see issue #17)."
            echo "$msg"
            echo "::warning title=Vercel deploy skipped::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # CLI from a lockfile with integrity hashes; lifecycle scripts disabled.
          npm ci --prefix tools/vercel --ignore-scripts --no-audit --no-fund
          tools/vercel/node_modules/.bin/vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN"
