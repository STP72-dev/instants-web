name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Secret scan (commits in this PR / push)
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then BASE="$(git rev-list --max-parents=0 HEAD | tail -1)"; fi
          node scripts/scan-diff.ts "$BASE"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # The shipped artifact: build the Docker image, serve it, and prove the CSP holds in a real browser.
      - name: Build and start the Docker image
        run: |
          docker build -t instants-web:ci .
          docker run -d --name web -p 18080:8080 instants-web:ci
          for _ in $(seq 1 30); do curl -fsS -o /dev/null http://localhost:18080/ && exit 0; sleep 1; done
          docker logs web; exit 1
      - name: Install Chromium for browser checks
        run: npx playwright install --with-deps chromium
      - name: CSP + same-origin check against the image
        run: npm run csp-check -- http://localhost:18080
